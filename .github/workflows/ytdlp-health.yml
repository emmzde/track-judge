name: yt-dlp health

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  youtube-smoke:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install current yt-dlp nightly
        run: python -m pip install --upgrade --pre "yt-dlp[default]"

      - name: Check YouTube extraction
        shell: pwsh
        run: |
          $output = & yt-dlp `
            --ignore-config `
            --simulate `
            --no-playlist `
            --socket-timeout 20 `
            --retries 2 `
            "https://www.youtube.com/watch?v=jNQXAC9IVRw" 2>&1 | Out-String
          $exitCode = $LASTEXITCODE
          Write-Host $output
          if ($exitCode -eq 0) {
            exit 0
          }
          if ($output -match "Sign in to confirm|not a bot") {
            Write-Warning "YouTube blocked the shared GitHub runner IP; extractor startup still worked."
            exit 0
          }
          exit $exitCode
