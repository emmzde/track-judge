name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-portable:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Build portable archive
        shell: pwsh
        run: ./scripts/build-portable.ps1

      - name: Build Windows installer
        shell: pwsh
        run: ./scripts/build-installer.ps1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: TrackJudge-Windows-x64
          path: |
            dist/TrackJudge-Windows-x64.zip
            dist/TrackJudge-Windows-x64.zip.sha256
            dist/TrackJudge-Setup-Windows-x64.exe
            dist/TrackJudge-Setup-Windows-x64.exe.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          "dist/TrackJudge-Windows-x64.zip"
          "dist/TrackJudge-Windows-x64.zip.sha256"
          "dist/TrackJudge-Setup-Windows-x64.exe"
          "dist/TrackJudge-Setup-Windows-x64.exe.sha256"
          --generate-notes
          --title "TrackJudge ${{ github.ref_name }}"
