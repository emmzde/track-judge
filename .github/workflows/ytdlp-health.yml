name: yt-dlp health

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  youtube-smoke:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install current yt-dlp nightly
        run: python -m pip install --upgrade --pre "yt-dlp[default]"

      - name: Check YouTube extraction
        shell: pwsh
        run: >-
          yt-dlp
          --ignore-config
          --simulate
          --no-playlist
          --socket-timeout 20
          --retries 2
          "https://www.youtube.com/watch?v=jNQXAC9IVRw"
