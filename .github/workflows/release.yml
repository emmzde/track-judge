name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-portable:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Build portable archive
        shell: pwsh
        run: ./scripts/build-portable.ps1

      - name: Build Windows installer
        shell: pwsh
        run: ./scripts/build-installer.ps1

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: TrackJudge-Windows-x64
          path: |
            dist/TrackJudge-Windows-x64.zip
            dist/TrackJudge-Windows-x64.zip.sha256
            dist/TrackJudge-Setup-Windows-x64.exe
            dist/TrackJudge-Setup-Windows-x64.exe.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $notes = Join-Path 'docs/releases' "$env:RELEASE_TAG.md"
          $notesArgs = if (Test-Path -LiteralPath $notes -PathType Leaf) {
            @('--notes-file', $notes)
          } else {
            @('--generate-notes')
          }
          gh release create $env:RELEASE_TAG `
            'dist/TrackJudge-Windows-x64.zip' `
            'dist/TrackJudge-Windows-x64.zip.sha256' `
            'dist/TrackJudge-Setup-Windows-x64.exe' `
            'dist/TrackJudge-Setup-Windows-x64.exe.sha256' `
            --verify-tag --title "TrackJudge $env:RELEASE_TAG" @notesArgs
