[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trackjudge"
description = "A Windows desktop app and Python CLI that compares audio candidates and keeps the best source."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dynamic = ["version"]
keywords = ["audio", "cli", "dsp", "spectrogram", "yt-dlp"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
    "numpy>=1.26",
    "rich>=13.7",
    "scipy>=1.11",
    "yt-dlp>=2026.7.4",
]

[project.optional-dependencies]
spectrogram = ["matplotlib>=3.8"]
dev = [
    "matplotlib>=3.8",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
]
build = [
    "matplotlib>=3.8",
    "pyinstaller>=6.19,<7",
]

[project.scripts]
trackjudge = "trackjudge.app:main"

[project.gui-scripts]
trackjudge-gui = "trackjudge.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "trackjudge.__version__"}

[tool.pytest.ini_options]
addopts = "-ra --basetemp=.pytest-tmp"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "PERF", "SIM", "UP"]
ignore = ["E501"]
